# cargo-deny configuration: licences, bans and sources.
# Rationale: exact pins and a licence allowlist, enforced in CI.

[licenses]
# Fails closed: everything not listed here is denied.
allow = [
    "MIT",
    # MIT-0 (MIT No Attribution, no added obligation): borrow-or-share, reached through
    # jsonschema -> referencing -> fluent-uri. Owner-approved 2026-11-01.
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OFL-1.1",
    "PSF-2.0",
]

[bans]
# No name bans: the Craft crates are the real ones, taken from the storytold/craft-libs git
# source, and cargo-deny cannot ban a name only when it comes from a registry (a ban by
# name also fails the git copy). A crates.io package with a Craft crate name is caught by
# `xtask sources` instead, which looks at where the package comes from.
# A git dependency needs `version = "=x.y.z"` next to `git` and `rev`, or the wildcard
# rule below reports it.
wildcards = "deny"
multiple-versions = "warn"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The one git source: the storytold Craft libraries. `xtask sources` also requires a full
# 40-hex commit (`rev`) and keeps this list equal to its own constant.
allow-git = ["https://github.com/storytold/craft-libs"]
