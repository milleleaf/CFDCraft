[tolerance]
nu_rel = 0.02
nu_rel_top = 0.03
velocity_rel = 0.03
velocity_rel_top = 0.05
position_abs = 0.03
justification = "Initial settings, to be approved after real runs. The allowances are fractions of the published value (positions are absolute, in units of the cavity side). The paper's accuracy is far tighter than a second-order finite-volume mesh will reach, so the gate is wider than the paper. Ra 1e6 is held looser because the paper calls its extrapolation there exceptionally sensitive. A user file may widen an allowance by at most three times and must say why."
