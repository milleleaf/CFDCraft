name: ci

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test (nextest)
        run: |
          cargo install cargo-nextest --version 0.9.150 --locked
          cargo nextest run --workspace --locked
      - name: xtask pins
        run: cargo run -p xtask -- pins
      - name: xtask layers
        run: cargo run -p xtask -- layers
      - name: xtask sources
        run: cargo run -p xtask -- sources
      - name: lockfile matches the manifests
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: WASM model
        run: cargo check -p cfdcraft-model --target wasm32-unknown-unknown --locked
      - name: cargo deny
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check licenses bans sources advisories
