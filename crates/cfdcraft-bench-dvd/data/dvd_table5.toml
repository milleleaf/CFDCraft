[source]
paper = "G. de Vahl Davis, Natural convection of air in a square cavity: a bench mark numerical solution, Int. J. Numer. Meth. Fluids 3, 249-264 (1983)"
doi = "10.1002/fld.1650030305"
table = "V"
page = 256
prandtl = 0.71
terms = "no terms stated; the table values are quoted as facts"
accuracy = "The solutions are believed to be accurate to better than 1 per cent at the highest Rayleigh number and down to one tenth of that at the lowest value."

[definition]
fluid = "Boussinesq fluid, Pr 0.71"
domain = "square cavity of side L, no slip on every wall, the two horizontal walls insulated, the vertical walls at Th (left) and Tc (right)"
velocity_scale = "kappa / L, so u* = u L Pr / nu"
temperature_scale = "T* = (T - Tc) / (Th - Tc)"
rayleigh = "Ra = g beta dT L^3 / (nu kappa), with kappa = nu / Pr"
positions = "lengths in units of L; u_max_z is the height of the largest horizontal velocity on the vertical mid-plane, w_max_x the distance from the hot wall of the largest vertical velocity on the horizontal mid-plane"

[[row]]
ra = 1000.0
u_max = 3.649
u_max_z = 0.813
w_max = 3.697
w_max_x = 0.178
nu_avg = 1.118
nu_0 = 1.117
nu_max = 1.505
