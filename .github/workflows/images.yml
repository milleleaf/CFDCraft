name: images

# Builds a solver image from its definition under docker/ and prints what was built.
# Nothing is pushed anywhere: there is no registry login, no write permission and no secret in use.
# An image is published only after the maintainers have reviewed it and approved that specific push.
# The listing is plain text in the job summary and in an artifact; a person reads the digest from there.

on:
  workflow_dispatch:
    inputs:
      image:
        description: Which image to build
        type: choice
        required: true
        options:
          - of14
          - su2
          - codesaturne
          - fieldcraft

permissions:
  contents: read

jobs:
  of14:
    if: inputs.image == 'of14'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build (not pushed)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/of14
          file: docker/of14/Dockerfile
          push: false
          load: true
          tags: solver-of14:build
      - name: print the image listing
        env:
          IMAGE: solver-of14:build
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -eu
          {
            echo "image: of14"
            echo "runner: $RUNNER_LABEL"
            echo "build digest: $BUILD_DIGEST"
            docker image inspect --format 'id: {{.Id}}' "$IMAGE"
            docker image inspect --format 'architecture: {{.Architecture}}' "$IMAGE"
            docker image inspect --format 'size in bytes: {{.Size}}' "$IMAGE"
            docker image inspect --format 'registry digests: {{json .RepoDigests}}' "$IMAGE"
          } | tee image.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-of14-${{ matrix.runner }}
          path: image.txt
          retention-days: 7
          if-no-files-found: error

  su2:
    if: inputs.image == 'su2'
