[package]
name = "cfdcraft-backend-su2"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
cfdcraft-backend = { path = "../cfdcraft-backend", version = "=0.1.0" }
cfdcraft-blockmesh = { path = "../cfdcraft-blockmesh", version = "=0.1.0" }
cfdcraft-gate = { path = "../cfdcraft-gate", version = "=0.1.0" }
cfdcraft-model = { path = "../cfdcraft-model", version = "=0.1.0" }
cfdcraft-settle = { path = "../cfdcraft-settle", version = "=0.1.0" }
cfdcraft-shapes = { path = "../cfdcraft-shapes", version = "=0.1.0" }
thiserror = "=2.0.21"

[dev-dependencies]
cfdcraft-templates = { path = "../cfdcraft-templates", version = "=0.1.0" }
# float_roundtrip: a number written into a study must read back as the same number.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
