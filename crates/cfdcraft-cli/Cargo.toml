[package]
name = "cfdcraft-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "cfdcraft"
path = "src/main.rs"

[dependencies]
cfdcraft-model = { path = "../cfdcraft-model", version = "=0.1.0" }
cfdcraft-mcp = { path = "../cfdcraft-mcp", version = "=0.1.0" }
cfdcraft-ops = { path = "../cfdcraft-ops", version = "=0.1.0" }
cfdcraft-text = { path = "../cfdcraft-text", version = "=0.1.0" }
clap = { version = "=4.6.7", features = ["derive"] }
craft-atomic = { workspace = true }

[dev-dependencies]
cfdcraft-doc = { path = "../cfdcraft-doc", version = "=0.1.0" }
cfdcraft-store = { path = "../cfdcraft-store", version = "=0.1.0" }
serde_json = "=1.0.154"
zip = { workspace = true }
