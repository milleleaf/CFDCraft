[package]
name = "cfdcraft-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "cfdcraft"
path = "src/main.rs"

[dependencies]
cfdcraft-model = { path = "../cfdcraft-model", version = "=0.1.0" }
cfdcraft-backend-esi = { path = "../cfdcraft-backend-esi", version = "=0.1.0" }
cfdcraft-executor = { path = "../cfdcraft-executor", version = "=0.1.0" }
cfdcraft-bench-ghia = { path = "../cfdcraft-bench-ghia", version = "=0.1.0" }
clap = { version = "=4.6.7", features = ["derive"] }

