[package]
name = "cfdcraft-import"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
blake3 = "=1.8.7"
cfdcraft-backend-esi = { path = "../cfdcraft-backend-esi", version = "=0.1.0" }
cfdcraft-foamdict = { path = "../cfdcraft-foamdict", version = "=0.1.0" }
craft-atomic = { workspace = true }
craft-docpath = { workspace = true }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip: the record is read back and compared with what was written.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
thiserror = "=2.0.21"
