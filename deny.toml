# cargo-deny configuration: licences, bans and sources.
# Rationale: exact pins and a licence allowlist, enforced in CI.

[licenses]
# Fails closed: everything not listed here is denied.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OFL-1.1",
    "PSF-2.0",
]

[bans]
wildcards = "deny"
multiple-versions = "warn"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"